<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Emblema Remanso Natural">
  <defs>
    <radialGradient id="rnBg" cx="32" cy="24" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132A1F"/>
      <stop offset="60%" stop-color="#0B1711"/>
      <stop offset="100%" stop-color="#060B08"/>
    </radialGradient>
    <linearGradient id="rnGold" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E5BD"/>
      <stop offset="45%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#9A793C"/>
    </linearGradient>
    <linearGradient id="rnGoldBright" x1="12" y1="16" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF0D7"/>
      <stop offset="55%" stop-color="#E5C88B"/>
      <stop offset="100%" stop-color="#B8934D"/>
    </linearGradient>
    <radialGradient id="rnHorizon" cx="32" cy="30" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8A96B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8A96B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rnClip">
      <circle cx="32" cy="32" r="27.2"/>
    </clipPath>
  </defs>

  <!-- Sello circular nocturno negro y verde bosque -->
  <circle cx="32" cy="32" r="30" fill="url(#rnBg)" stroke="url(#rnGold)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.2" fill="none" stroke="#E8CFA0" stroke-opacity="0.28" stroke-width="0.8"/>

  <g clip-path="url(#rnClip)">
    <!-- Brillo de horizonte -->
    <circle cx="32" cy="30" r="18" fill="url(#rnHorizon)"/>

    <!-- Cordillera nevada y volcán al horizonte -->
    <path d="M5 35 L21 17.5 L31 28 L42.5 14.5 L59 35 Z" fill="#0F241A" fill-opacity="0.88"/>
    <path d="M6 34.5 L21 17.5 L31 28 L42.5 14.5 L58 34.5" fill="none" stroke="url(#rnGoldBright)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nieves eternas en cumbres -->
    <path d="M18.2 21.2 L21 22.8 L23.8 21.2" fill="none" stroke="#F4F0E8" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
    <path d="M39.3 18.6 L42.5 20.6 L45.7 18.6" fill="none" stroke="#F4F0E8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Islas emergiendo en el mar interior -->
    <path d="M31 38.5 Q39 30.5 47.5 38.5 Z" fill="#183829" stroke="url(#rnGold)" stroke-width="1.25" stroke-linejoin="round"/>
    <path d="M43 38.5 Q50 32.5 57.5 38.5 Z" fill="#132E21" stroke="url(#rnGold)" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Bosque nativo costero -->
    <path d="M12.5 36.2 L16.2 26.8 L19.9 36.2 Z" fill="#1E4734" stroke="url(#rnGoldBright)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M17.8 36.8 L22.2 24.4 L26.6 36.8 Z" fill="#265941" stroke="url(#rnGoldBright)" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M24.2 37.2 L27.6 28.6 L31 37.2 Z" fill="#1B3F2E" stroke="url(#rnGold)" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Playa curva y ribera -->
    <path d="M5 38.5 Q18 35.4 33.5 39.2 Q46 41.2 59 38.5 L59 42.5 L5 42.5 Z" fill="#0B1912"/>
    <path d="M5 38.6 Q19 35.6 34 39.2" fill="none" stroke="url(#rnGoldBright)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 39.2 Q45 40.4 59 38.4" fill="none" stroke="url(#rnGold)" stroke-width="1.35" stroke-linecap="round" opacity="0.85"/>

    <!-- Aguas tranquilas de mar, canales y lago -->
    <path d="M9 44.8 Q20 41.8 32 44.8 T55 44.8" fill="none" stroke="url(#rnGoldBright)" stroke-width="1.85" stroke-linecap="round"/>
    <path d="M15 49.8 Q23.5 47.4 32 49.8 T49 49.8" fill="none" stroke="url(#rnGold)" stroke-width="1.35" stroke-linecap="round" opacity="0.85"/>
    <path d="M22 54.4 Q27 52.8 32 54.4 T42 54.4" fill="none" stroke="url(#rnGold)" stroke-width="1.05" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
